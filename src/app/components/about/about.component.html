<div class="about_container" id="section1">
  <div class="about_text portfolio-reveal">
    @let text = language.text();
    <h1>{{ text.aboutTitle }}</h1>
    <p>{{ text.aboutIntroStart }}<span>{{ text.aboutRole }}</span>{{ text.aboutIntroEnd }}</p>
    @for (paragraph of text.aboutParagraphs; track $index) {
      <br>
      <p>{{ paragraph }}</p>
    }
  </div>
  <div class="button-links_container portfolio-reveal">
    <app-button
      class="button"
      width="300px"
      height="100px"
      title="Linkedin"
      link="https://www.linkedin.com/in/renanbreier/"
      logo="assets/icons/linkedin_icon.svg"
    ></app-button>
    <app-button
      class="button"
      width="300px"
      height="100px"
      title="GitHub"
      link="https://github.com/renanbreier"
      logo="assets/projects/git2.svg"
    ></app-button>
    <app-button
      class="button"
      width="300px"
      height="100px"
      title="Instagram"
      link="https://www.instagram.com/renan.breier/#"
      logo="assets/icons/instagram.png"
    ></app-button>
  </div>
</div>
