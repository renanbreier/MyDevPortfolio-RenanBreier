@let text = language.text();
<div class="bigCard_container" id="section0">
  <div class="bigCard_text">
    <h5 [attr.aria-label]="text.welcome">{{ displayedText() }}</h5>
    <h1 class="titulo">{{ text.roleFirst }} <span class="portfolio-text-accent">{{ text.roleHighlight }}</span></h1>
    <div class="button-icons-container">
      <button class="cta-button" (click)="scrollToSection('section3')">
        {{ text.viewProjects }}
        <span class="arrow" aria-hidden="true">→</span>
      </button>
      <div class="icons">
        <a href="https://github.com/renanbreier" target="_blank" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://linkedin.com/in/renanbreier" target="_blank" aria-label="LinkedIn">
          <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="javascript:void(0)" (click)="scrollToSection('section5')" aria-label="Email">
          <i class="fas fa-envelope"></i>
        </a>
      </div>
    </div>
  </div>
  <div class="bigCard_photo">
    <a
      href="https://github.com/renanbreier"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
    >
      <img src="../../../assets/photo.png" alt="" srcset="" />
    </a>
  </div>
</div>
