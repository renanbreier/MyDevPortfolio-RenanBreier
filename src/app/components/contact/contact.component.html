@let text = language.text();
<div class="container" id="section5">
  <div class="text portfolio-reveal">
    <h1>{{ text.contactTitle }}</h1>
    <p>{{ text.contactSubtitle }}</p>
  </div>
  <div class="container_body">
    <div class="container_form">
      <form #formDirective="ngForm" (ngSubmit)="onSubmit(formDirective.value)">
        <div class="form_data">
          <div class="name">
            <input
              type="text"
              name="name"
              [(ngModel)]="name"
              [placeholder]="text.contactName"
              [attr.aria-label]="text.contactName"
              required
            />
          </div>
          <div class="email">
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              [placeholder]="text.contactEmail"
              [attr.aria-label]="text.contactEmail"
              required
            />
          </div>
        </div>
        <div class="form_text-area">
          <textarea
            name="message"
            [(ngModel)]="message"
            [placeholder]="text.contactMessage"
            [attr.aria-label]="text.contactMessage"
            rows="10"
            required
          ></textarea>
        </div>
        <button type="submit">{{ text.contactSend }}</button>
      </form>
    </div>
  </div>
</div>
