@let text = language.text();
@let locale = language.language();
<section id="section4" class="skills-section">
  <div class="content-wrapper">
    <div class="header portfolio-reveal">
      <h2 class="title">&lt; {{ text.skillsTitle }} /&gt;</h2>
      <p class="subtitle">
        {{ text.skillsSubtitle }}
      </p>
    </div>

    <div class="grid">
      @for (skill of skillsList; track skill) {
        <div
          class="skill-card portfolio-reveal"
          [style.--from]="skill.gradientFrom"
          [style.--to]="skill.gradientTo"
        >
          <div class="icon-wrapper">
            <img [src]="skill.iconClass" />
          </div>
          <h3 class="skill-title">{{ skill.name }}</h3>
          <p class="skill-desc">{{ skill.description[locale] }}</p>
        </div>
      }
    </div>
  </div>
</section>
