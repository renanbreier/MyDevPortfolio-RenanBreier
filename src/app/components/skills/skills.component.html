@let text = language.text();
@let locale = language.language();
<section id="section4" class="portfolio-section" aria-labelledby="skills-title">
  <div class="shell">
    <header class="section-heading portfolio-reveal">
      <h2 id="skills-title">{{ text.skillsTitle }}</h2>
      <p>{{ text.skillsSubtitle }}</p>
    </header>
    <div class="grid">
      @for (skill of skillsList; track skill.name) {
        <article class="skill-card surface interactive-surface portfolio-reveal">
          <img [src]="skill.iconClass" alt="" width="34" height="34" loading="lazy">
          <h3>{{ skill.name }}</h3>
          <p>{{ skill.description[locale] }}</p>
        </article>
      }
    </div>
  </div>
</section>
